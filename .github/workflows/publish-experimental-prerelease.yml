name: Publish v4.5.0 LAN experimental prerelease

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prerelease:
    # Strict one-time merge-commit guard: ordinary future pushes do not publish.
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Merge PR #1: PulseDirector LAN v4.5.0 experimental prerelease') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish experimental prerelease once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v4.5.0-lan-rc.1
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already published; no changes made."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PulseDirector v4.5.0 LAN Edition — Experimental Prerelease" \
            --notes-file docs/PRERELEASE_NOTES.md \
            --prerelease \
            --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,isDraft,url
